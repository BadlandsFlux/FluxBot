[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["dashboard-frontend"]

[tool.ruff.lint]
# E501 (line length) is deliberately off: this codebase doesn't enforce a
# wrap column, and retrofitting one onto every existing long line isn't
# worth the unrelated diff noise it'd add to this change. The rest of E/F/W
# catches real issues (unused imports, undefined names, etc) cheaply.
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Without this, `bot`/`common` (plain top-level packages, not installed)
# are only importable when something external puts the repo root on
# sys.path first (PYTHONPATH=., or running `python -m pytest` instead of
# the bare `pytest` entry point). CI invokes plain `pytest`, so this is
# load-bearing, not a convenience.
pythonpath = ["."]
